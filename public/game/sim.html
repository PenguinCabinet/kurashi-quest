<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Mac と iPhone はヒラギノ丸ゴが最初から入っているので、これは読み込まれない。
     Windows と Android のときだけ落ちてくる -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet" />
<title>窓口の練習 — 暮らしクエスト（確認用）</title>
<link rel="stylesheet" href="./game.css?v=1785492195" />
<style>
  main { max-width: 720px; }

  /* 職員のことば。コマンドウィンドウ */
  .window { border-top: 1px solid rgba(26,26,26,.25); border-bottom: 1px solid rgba(26,26,26,.25); margin-top: 16px; }
  /* 職員を主役にする。この画面の見せ場は会話なので、絵を大きく出す */
  .stage { display: flex; gap: 20px; align-items: flex-end; padding: 6px 0 10px; }
  .stage img {
    flex: none; width: auto; height: min(38vh, 320px);
    margin-bottom: -10px;   /* 台の線に足をそろえる */
  }
  @media (max-width: 720px) {
    .stage { gap: 12px; }
    .stage img { height: min(26vh, 190px); }
  }
  .say {
    flex: 1; min-width: 0; padding-bottom: 6px;
    font-family: var(--maru);
    font-size: 20px; line-height: 1.9;
  }
  .say .who {
    display: block; font-family: -apple-system, "Hiragino Sans", sans-serif;
    font-size: 11px; letter-spacing: .18em; color: #6b7280; margin-bottom: 4px;
  }
  .say .sub { display: block; font-size: 13px; font-family: var(--maru); color: #55606e; margin-top: 4px; }
  .say .ng { color: var(--shu); }

  /* 何回目の来庁か */
  .tally { display: flex; gap: 22px; padding: 0 0 6px; font-size: 12px; color: #55606e; }
  .tally b { font-family: var(--maru); font-size: 17px; color: var(--sumi); margin-left: 4px; }
  .tally .shu b { color: var(--shu); }
  @media (max-width: 560px) {
    .stage { flex-direction: column; align-items: flex-start; gap: 6px; }
    .stage img { height: min(24vh, 190px); margin-bottom: 0; align-self: center; }
    .say { font-size: 18px; }
  }
</style>
</head>
<body class="bare" data-place="counter">
<main id="page"></main>
<script type="module" src="./page-sim.js?v=1785478907"></script>
</body>
</html>
