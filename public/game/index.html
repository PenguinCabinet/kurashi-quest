<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Mac と iPhone はヒラギノ丸ゴが最初から入っているので、これは読み込まれない。
     Windows と Android のときだけ落ちてくる -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet" />
<title>暮らしクエスト</title>
<style>
  :root { --maru: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "M PLUS Rounded 1c", "Zen Maru Gothic", -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { min-height: 100dvh; }   /* スマホのアドレスバーで下が切れないように */
  body {
    font-family: var(--maru);
    color: #1a1a1a; background: #dcd8d0; overflow: hidden;
    display: grid; place-items: center;
  }

  /* 背景。ゆっくり寄る。絵はそのまま見せる */
  .bg {
    position: fixed; inset: 0;
    background: url("./characters/bg-counter.jpg") center / cover;
    animation: zoom 40s ease-in-out infinite alternate;
  }
  @keyframes zoom { from { transform: scale(1.05); } to { transform: scale(1.14); } }
  @media (prefers-reduced-motion: reduce) { .bg { animation: none; } }

  .stage {
    position: relative; text-align: center; padding: 20px;
    animation: rise 1.3s cubic-bezier(.2,.75,.2,1) both;
  }
  /* 文字の後ろだけ、ふちの無い明かりを置く。枠は作らない */
  .stage::before {
    content: ""; position: absolute; inset: -10vh -12vw; z-index: -1;
    background: radial-gradient(58% 52% at 50% 50%,
      rgba(255,255,255,.88) 0%, rgba(255,255,255,.62) 46%, rgba(255,255,255,0) 78%);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.99); } to { opacity: 1; transform: none; } }

  .catch {
    font-family: var(--maru);
    font-size: clamp(11px, 1.35vw, 14px); color: #4b5563;
    margin-bottom: 18px;
  }

  /* 題字。折り返さない */
  h1 {
    margin: 0; white-space: nowrap;
    font-family: var(--maru); font-weight: 600;
    font-size: clamp(34px, 6.4vw, 78px); line-height: 1.1; letter-spacing: .05em;
    color: #1a1a1a;
  }
  .sub {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--maru); font-size: clamp(11px, 1.4vw, 14px);
    color: #4b5563; margin-top: 14px;
  }
  .sub i { display: block; width: 34px; height: 1px; background: rgba(26,26,26,.3); }

  /* コマンド。箱は作らず、絵の上に直接置く */
  .win { margin: 34px auto 0; width: min(340px, 86vw); text-align: left; }

  .cmd {
    display: block; width: 100%; text-align: left; font: inherit; color: #1a1a1a;
    background: none; border: none; border-top: 1px solid rgba(26,26,26,.22);
    cursor: pointer; text-decoration: none;
    padding: 12px 8px 12px 34px; position: relative;
  }
  .cmd:last-child { border-bottom: 1px solid rgba(26,26,26,.22); }
  .cmd::before {
    content: "▶"; position: absolute; left: 10px; top: 15px;
    font-size: 12px; color: var(--shu, #b32d2e); opacity: 0;
  }
  .cmd[data-on="true"]::before { opacity: 1; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
  .cmd[data-on="true"] .t { color: #b32d2e; }
  .cmd .t { font-size: 18px; font-weight: 700; letter-spacing: .06em; }
  .cmd .s { display: block; font-size: 12px; color: #55606e; margin-top: 2px; font-weight: 400; }

  .hint {
    margin-top: 16px; font-size: 11px; letter-spacing: .18em; color: #55606e;
  }
  /* 指で触る端末には、キーの案内を出さない */
  @media (pointer: coarse) { .hint { display: none; } }
  @media (max-width: 560px) {
    .stage { padding: 16px; }
    .win { margin-top: 26px; width: 100%; }
    .cmd { padding: 14px 8px 14px 32px; }
    .catch { margin-bottom: 14px; }
  }
  .foot { position: fixed; left: 12px; bottom: 9px; font-size: 10px; color: #8a8f98; }

  /* 柴犬のひとこと。何も言わない絵は、ただの飾りになる */
  .bark {
    position: fixed; z-index: 1;
    right: calc(4vw + min(34vh, 290px) - 20px);
    bottom: min(20vh, 168px);
    max-width: min(300px, 46vw);
    background: #fff; border: 2px solid var(--sumi);
    padding: 11px 14px; font-size: 14px; line-height: 1.7;
  }
  .bark::after {
    content: ""; position: absolute; right: -9px; bottom: 16px;
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 9px solid var(--sumi);
  }
  .bark::before {
    content: ""; position: absolute; right: -6px; bottom: 18px; z-index: 1;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 7px solid #fff;
  }
  .bark .who { display: block; font-size: 10px; letter-spacing: .18em; color: #8a8f98; margin-bottom: 3px; }
  @media (max-width: 760px) {
    .bark {
      right: 2vw; bottom: calc(26vh + 8px);
      max-width: 72vw; font-size: 13px;
    }
    .bark::after, .bark::before { display: none; }
  }

  /* 案内役の柴犬。受付の前に立っている、という置き方。
     画面の外から入ってくる動きは付けない（それはWebサイトの見せ方）。
     息をしているぶんだけ、ゆっくり上下する */
  .shiba {
    position: fixed; right: 4vw; bottom: 0; z-index: 0;
    height: min(34vh, 290px); width: auto;
    pointer-events: none;   /* 犬の上を押しても、下のコマンドが押せるように */
    transform-origin: bottom center;
    animation: shibaiki 2.8s ease-in-out infinite alternate;
  }
  @keyframes shibaiki {
    from { transform: translateY(0) scaleY(1); }
    to   { transform: translateY(-3px) scaleY(1.006); }
  }
  @media (max-width: 760px) {
    .shiba { height: 26vh; right: 2vw; }
  }
  @media (prefers-reduced-motion: reduce) { .shiba { animation: none; } }

  /* 音の入切。game.css を読んでいないので、ここにも同じものを置く */
  .soundtoggle {
    position: fixed; left: 14px; bottom: 30px; z-index: 5;
    font: inherit; font-size: 11px; letter-spacing: .14em;
    background: rgba(255,255,255,.85); border: 1px solid rgba(26,26,26,.25);
    color: #6b7280; padding: 4px 10px; cursor: pointer;
  }
  .soundtoggle[data-on="true"] { color: #6b7280; }
  .soundtoggle[data-on="false"] { color: #b32d2e; border-color: rgba(179,45,46,.5); }
  .soundtoggle:hover { background: #fff; }
</style>
</head>
<body data-keys="off">
<div class="bg"></div>

<div class="stage">
  <div class="catch">何を持っていけばいいのか、誰も教えてくれない。</div>
  <h1>暮らしクエスト</h1>
  <div class="sub"><i></i>行政手続き ロールプレイング<i></i></div>

  <div class="win" id="menu"></div>
  <div class="hint">↑ ↓ でえらぶ　　Enter でけってい</div>
</div>

<div class="bark" id="bark" hidden></div>
<img class="shiba" src="./characters/title-shiba.png" alt="" onerror="this.remove()" />

<div class="foot">確認用のプレビューです</div>

<script type="module">
  import { app, data } from "./common.js";
  import { sfx } from "./sound.js";
  import { buildBoard } from "./quest/index.js";

  const board = buildBoard(data, app.profile, app.progress, app.today);
  const answered = 6 - board.missingAnswers.length;
  const { remaining, done } = board.stats;

  // 答えていなくても、達成の記録があれば「途中」あつかいにする。
  // でないと「はじめる」を出しながら、中では6件達成のままになる
  let list;
  if (answered === 0 && done === 0) {
    list = [
      ["はじめる", "chara.html", "6つの質問に答えると、あなたの分だけが出ます"],
      ["一覧だけ見る", "quests.html", "答えなくても、だいたいの流れは分かります"],
    ];
  } else if (remaining === 0) {
    list = [
      ["つづきから", "quests.html", `${done}件ぜんぶ終わっています`],
      ["はじめから", "chara.html?new=1", "答えも達成も消して、まっさらから"],
    ];
  } else {
    // 入口は「つづき」と「はじめ」の2つだけ。
    // 市役所へは、つづきから入ったクエストログの中から行けます
    list = [
      ["つづきから", "quests.html", `のこり ${remaining}件　終わったのは ${done}件`],
      ["はじめから", "chara.html?new=1", "答えも達成も消して、まっさらから"],
    ];
  }

  const menu = document.getElementById("menu");

  // 柴犬のひとこと。状態で変わる
  const bark = document.getElementById("bark");
  const line =
    answered === 0 && done === 0
      ? "はじめまして。引越しの手続き、ぼくが案内します。"
      : remaining === 0
        ? `ぜんぶ終わりましたね。おつかれさまでした。`
        : `おかえりなさい。のこりは ${remaining}件です。`;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = "あんない";
  bark.append(who, document.createTextNode(line));
  // 絵が無いときは、ひとことも出さない（誰がしゃべっているか分からなくなる）
  const dog = document.querySelector(".shiba");
  if (dog) {
    dog.addEventListener("load", () => bark.removeAttribute("hidden"));
    if (dog.complete && dog.naturalWidth) bark.removeAttribute("hidden");
  }
  const nodes = list.map(([label, href, small], i) => {
    const a = document.createElement("a");
    a.className = "cmd";
    a.href = href;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = label;
    a.append(t);
    if (small) {
      const s = document.createElement("span");
      s.className = "s";
      s.textContent = small;
      a.append(s);
    }
    a.addEventListener("mouseenter", () => { if (i !== at) move(i); });
    menu.append(a);
    return a;
  });

  let at = 0;
  function move(i, quiet) {
    at = (i + nodes.length) % nodes.length;
    nodes.forEach((n, k) => n.setAttribute("data-on", String(k === at)));
    if (!quiet) sfx.move();
  }
  move(0, true);   // 最初の1回は鳴らさない

  // 矢印で選んで Enter。ここが「サイトではない」いちばんの差
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "j") { move(at + 1); e.preventDefault(); }
    else if (e.key === "ArrowUp" || e.key === "k") { move(at - 1); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === " ") { sfx.select(); nodes[at].click(); e.preventDefault(); }
  });
</script>
</body>
</html>
