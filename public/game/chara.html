<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Mac と iPhone はヒラギノ丸ゴが最初から入っているので、これは読み込まれない。
     Windows と Android のときだけ落ちてくる -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet" />
<title>あなたのこと — 暮らしクエスト（確認用）</title>
<link rel="stylesheet" href="./game.css?v=1785493237" />
<style>
  /* 何問目か。クエストログの枡と同じ形 */
  .steps { display: flex; align-items: center; gap: 5px; margin-bottom: 20px; }
  .steps i { width: 15px; height: 15px; border: 1px solid var(--keisen); }
  .steps i[data-state="done"] { background: var(--keisen); border-color: var(--keisen); cursor: pointer; }
  .steps i[data-state="done"]:hover { background: var(--shu); border-color: var(--shu); }
  .steps i[data-state="now"] { background: var(--shu); border-color: var(--shu); }
  .steps .n { margin-left: 8px; font-family: var(--maru); font-size: 13px; color: #6b7280; }

  /* 絵で選ぶ */
  .opts.cards { display: flex; border-top: 1px solid var(--keisen); }
  .opts.cards button.card {
    flex: 1; font: inherit; border: none; border-right: 1px solid var(--keisen);
    border-radius: 0; padding: 16px 10px 14px; text-align: center;
    background: none; cursor: pointer; position: relative;
  }
  .opts.cards button.card:last-child { border-right: none; }
  .opts.cards img {
    display: block; width: 100%; max-width: 165px; margin: 0 auto 10px;
    filter: grayscale(.55) opacity(.55);
  }
  .opts.cards .cap { display: block; font-size: 17px; font-weight: 700; color: #6b7280; }
  .opts.cards .sub { display: block; font-size: 11px; color: #9ca3af; margin-top: 3px; }
  .opts.cards button.card:hover { background: var(--usu); }
  .opts.cards button.card:hover img { filter: grayscale(.15) opacity(.9); }

  .opts.cards button.card[aria-pressed="true"] { background: #fff; box-shadow: inset 0 0 0 3px var(--shu); }
  /* 選んだ絵に朱の枠が付くので、カーソルの枠は絵の外に出さない */
  .opts.cards button.card[data-key="on"] { outline: none; background: rgba(255,255,255,.62); }
  .opts.cards button.card[data-key="on"] .cap { color: var(--sumi); text-decoration: underline; text-underline-offset: 4px; }
  .opts.cards button.card[aria-pressed="true"] img { filter: none; }
  .opts.cards button.card[aria-pressed="true"] .cap { color: var(--shu); }
  .opts.cards button.card[aria-pressed="true"] .sub { color: #6b7280; }
  .opts.cards button.card[aria-pressed="true"]::after {
    content: "これ"; position: absolute; top: 12px; right: 12px;
    padding: 3px 7px; border: 2px solid var(--shu); color: var(--shu);
    background: #fff; font-weight: 700; font-size: 13px; transform: rotate(-7deg);
  }

  /* 文字だけの選択肢 */
  .opts:not(.cards) button {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 17px;
    background: none; border: none; border-radius: 0;
    border-bottom: 1px solid var(--keisen);
    padding: 13px 8px 13px 32px; cursor: pointer; position: relative;
  }
  .opts:not(.cards) button::before { content: "▶"; position: absolute; left: 10px; color: transparent; }
  .opts:not(.cards) button:hover { background: var(--usu); }
  .opts:not(.cards) button:hover::before { color: var(--shu); }
  .opts:not(.cards) button[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--shu); }
  .opts:not(.cards) button[aria-pressed="true"]::before { content: "■"; color: var(--shu); }
  .opts:not(.cards) .sub { display: block; font-size: 12px; color: #6b7280; }

  /* 決まったこと */
  .change { border-top: 2px solid var(--sumi); background: #fff; padding: 11px 14px; }
  .change .k { font-size: 11px; letter-spacing: .1em; color: #6b7280; }
  .change div { padding: 1px 0; font-size: 14px; }
  .change .add { color: var(--ai); }
  .change .del { color: var(--shu); }

  /* できあがり */
  .card-name { font-family: var(--maru); font-size: 21px; font-weight: 700; padding: 2px 0 10px; }
  /* 項目名を 11em に押し込むと、長い名前がはみ出して値とくっつく。
     幅ではなく「最低幅＋すき間」で組む */
  .stat { display: flex; gap: 16px; border-top: 1px solid var(--keisen); padding: 8px 0; font-size: 14px; }
  .stat .k { flex: none; min-width: 11em; color: #6b7280; }
  .stat .v { flex: 1; min-width: 0; font-weight: 700; }
  .stat .v .shu { color: var(--shu); }

  /* ── スマホ ──────────────────────────────────────────
     絵を横に3枚並べると1枚107pxになり、何の絵か分からない。
     縦に積んで、絵を左・文字を右にする。
     （この塊は、上の指定より後に置くこと。前に置くと上書きされる） */
  @media (max-width: 560px) {
    /* 幅が足りないときは、項目名を上、値を下にする */
    .stat { display: block; }
    .stat .k { min-width: 0; }
    .stat .v { margin-top: 1px; }

    .opts.cards { display: block; border-top: 1px solid rgba(26,26,26,.16); }
    .opts.cards button.card {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 12px 4px; text-align: left;
      border-right: none; border-bottom: 1px solid rgba(26,26,26,.12);
    }
    .opts.cards button.card:last-child { border-bottom: none; }
    .opts.cards img {
      width: 92px; max-width: 92px; margin: 0; flex: none;
    }
    .opts.cards .cap,
    .opts.cards .sub { text-align: left; }
    .opts.cards .cap { font-size: 17px; line-height: 1.5; }
    /* 「これ」の判子は、絵に重ならない位置に */
    .opts.cards button.card[aria-pressed="true"]::after {
      top: 50%; right: 6px; margin-top: -15px;
    }
    body.bare .opts.cards button.card[aria-pressed="true"] img {
      outline-width: 2px; outline-offset: 2px;
    }
  }
</style>
</head>
<body class="bare" data-place="home">
<main>
  <div id="page"></div>
</main>
<script type="module" src="./page-home.js?v=1785493237"></script>
</body>
</html>
